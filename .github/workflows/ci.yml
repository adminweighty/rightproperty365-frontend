name: CI

# Runs on pull requests and on main. Pushes to dev and production are checked
# by publish-and-update-gitops.yml, which calls this workflow before building.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Design tokens are in sync and pass contrast checks
        run: |
          npm run tokens
          git diff --exit-code design/tokens/tokens.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
